[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircursor"
version = "0.0.1"
description = "Control the mouse cursor with hand gestures via a webcam."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.20",
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
aircursor = "aircursor.cli:main"

[tool.setuptools.packages.find]
include = ["aircursor*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
